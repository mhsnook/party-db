name: Release

# Stages a release on a pushed tag `v*`. Tag = the version already bumped in
# package.json (no version automation; see plan 008 maintenance notes).
#
# The staged version isn't installable until a maintainer approves it on
# npmjs.com with 2FA. npm trusts this workflow by its filename, through the
# package's trusted publisher settings, so no npm token is stored here.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json's `packageManager` field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test

      - run: pnpm test:integration

      # `npm stage` needs npm 11.15.0 or later; Node 22 bundles an older npm.
      - run: npm install -g npm@^11.15.0

      - run: npm stage publish
