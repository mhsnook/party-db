name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # Reachable by both pg lanes: the node lane reads PG_URL directly, the
    # integration config forwards it into miniflare as the worker's PG_URL binding.
    # Points at the disposable Postgres started below.
    env:
      PG_URL: postgres://postgres:postgres@localhost:5432/party_db_test

    steps:
      - uses: actions/checkout@v4

      # A disposable Postgres for the pg lanes. Started with `docker run` rather than
      # a `services:` container because we need `-c wal_level=logical` — a command
      # arg, which service containers can't pass. This is the SAME one-liner the
      # README documents for local dev, so CI and local stay in lockstep; keep the
      # pinned version (17-alpine) matching there. `wal_level=logical` costs nothing
      # now and is what the eventual WAL/replication work (docs/postgres-todo.md)
      # needs, so it's on from day one. Health-gated so a slow start can't flake.
      - name: Start Postgres (wal_level=logical)
        run: |
          docker run -d --name party-db-pg \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=party_db_test \
            -p 5432:5432 \
            --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 5s --health-retries 20 \
            postgres:17-alpine -c wal_level=logical
          # block until the container reports healthy before any test step runs
          for i in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' party-db-pg)" = healthy ] && break
            sleep 1
          done
          docker exec party-db-pg psql -U postgres -c "SHOW wal_level"

      # pnpm version comes from package.json's `packageManager` field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test

      - run: pnpm test:integration

      - run: pnpm test:pg

      - run: pnpm publish --dry-run --no-git-checks

  # The examples are the only userspace check we have. They import party-db from
  # ../../src exactly the way an app imports the package, so they exercise the public
  # surface — which the library's own suites, sitting inside that surface, cannot.
  #
  # This job exists because v0.0.2 shipped a broken example-react-polyglot: the release
  # turned `auth` into a real hook returning a `WriteIdentity`, the example still
  # returned a bare uid string, and every write in it came back 401. Nothing in CI
  # typechecked an example, so nothing caught it.
  examples:
    runs-on: ubuntu-latest

    strategy:
      # one broken example shouldn't hide the state of the other three
      fail-fast: false
      matrix:
        example: [example, example-react, example-react-polyglot, example-react-rdbms]

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json's `packageManager` field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            ${{ matrix.example }}/pnpm-lock.yaml

      # BOTH installs are load-bearing, and the reason is easy to miss: each example is
      # its own pnpm workspace, so `partyserver` and `@tanstack/db` resolve from the
      # EXAMPLE's node_modules — but the library sources it imports (../../src) resolve
      # theirs from the ROOT node_modules, walking up from src/. Drop either install and
      # tsc fails on modules it cannot find.
      - run: pnpm install --frozen-lockfile

      - run: pnpm install --frozen-lockfile
        working-directory: ${{ matrix.example }}

      # each example runs both halves: the browser config and the workers config
      - run: pnpm typecheck
        working-directory: ${{ matrix.example }}
